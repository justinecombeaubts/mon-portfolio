<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="NoX, bot Discord d'automatisation de serveur">
  <title>NoX, bot Discord d'automatisation de serveur</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#3A1A20"/>
      <stop offset="1" stop-color="#1A1014"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2C27E"/>
      <stop offset="1" stop-color="#A9843F"/>
    </linearGradient>
  </defs>

  <!-- médaillon -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="64" cy="64" r="53" fill="none" stroke="#C9A55C" stroke-opacity=".45" stroke-width="1"/>

  <!-- croissant de lune (NoX, la nuit) -->
  <path d="M58 28 A30 30 0 1 0 90 74 A24 24 0 1 1 58 28Z" fill="#7A1F2B" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- arborescence du serveur : catégorie et salons générés -->
  <path d="M64 50 V84 M64 60 H74 M64 72 H74 M64 84 H74" stroke="#EFE6D8" stroke-opacity=".75" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <rect x="58" y="44" width="12" height="8" rx="2" fill="url(#gold)"/>
  <rect x="76" y="57" width="16" height="6" rx="2" fill="url(#gold)"/>
  <rect x="76" y="69" width="12" height="6" rx="2" fill="url(#gold)"/>
  <rect x="76" y="81" width="14" height="6" rx="2" fill="url(#gold)"/>
  <path d="M94 31 L95.4 34.6 L99 36 L95.4 37.4 L94 41 L92.6 37.4 L89 36 L92.6 34.6Z" fill="#E2C27E" opacity="1"/><path d="M98 92 L98.84 94.16 L101 95 L98.84 95.84 L98 98 L97.16 95.84 L95 95 L97.16 94.16Z" fill="#E2C27E" opacity="0.7"/>
</svg>
